<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PPDB Wawancara SMKN 1 Sampit</title>
<style>
body{font-family:Arial;margin:20px;background:#f5f5f5}
.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px}
.hidden{display:none} button{padding:8px 14px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:6px}
</style>
</head>
<body>
<h2>PPDB Wawancara SMKN 1 Sampit</h2>

<div class="card" id="step1">
<h3>Data Peserta</h3>
<input id="nama" placeholder="Nama" style="width:100%;margin:4px"><br>
<input id="nisn" placeholder="NISN" style="width:100%;margin:4px"><br>
<input id="asal" placeholder="Asal Sekolah" style="width:100%;margin:4px"><br>
<select id="jur1"></select><br>
<select id="jur2"></select><br><br>
<button onclick="mulai()">Mulai Wawancara</button>
</div>

<div id="soalArea" class="card hidden"></div>
<div id="hasil" class="card hidden"></div>

<div class="card">
<h3>Histori</h3>
<button onclick="exportJSON()">Export Data</button>
<button onclick="hapusHistori()">Hapus Histori</button>
<table id="hist"></table>
</div>

<script>
const jurusan=["Akuntansi","Layanan Perbankan","Bisnis Digital","Bisnis Retail","Manajemen Perkantoran","Manajemen Logistik","Desain Komunikasi Visual","Rekayasa Perangkat Lunak"];
jurusan.forEach(j=>{
jur1.innerHTML+=`<option>${j}</option>`;
jur2.innerHTML+=`<option>${j}</option>`;
});

const umum=[
"Motivasi masuk SMK","Alasan memilih SMKN 1 Sampit","Pengetahuan tentang sekolah","Manfaat belajar di SMK","Harapan setelah lulus",
"Alasan memilih jurusan","Mencari informasi jurusan","Kesiapan belajar jurusan","Menghadapi kesulitan belajar","Kesesuaian hobi dengan jurusan",
"Rencana setelah lulus","Pentingnya cita-cita","Cara mencapai cita-cita","Sikap saat gagal","Tujuan belajar",
"Kesiapan mematuhi tata tertib","Mengerjakan tugas","Mengatur waktu belajar","Mengatasi kesulitan pelajaran","Disiplin belajar"
];

function buatSoal(j){
 let s='';
 for(let i=1;i<=10;i++){
   s+=q(`${j} No.${i}`);
 }
 return s;
}

function q(teks){
return `<div><p>${teks}</p>
<label><input type='radio' name='${teks}' value='4'>A</label>
<label><input type='radio' name='${teks}' value='3'>B</label>
<label><input type='radio' name='${teks}' value='2'>C</label>
<label><input type='radio' name='${teks}' value='1'>D</label></div><hr>`;
}

function mulai(){
 let html="<h3>Soal Umum</h3>";
 umum.forEach(x=>html+=q(x));
 html+=`<h3>Jurusan Pilihan 1: ${jur1.value}</h3>`+buatSoal(jur1.value);
 html+=`<h3>Jurusan Pilihan 2: ${jur2.value}</h3>`+buatSoal(jur2.value);
 html+=`<button onclick='hitung()'>Hitung Nilai</button>`;
 soalArea.innerHTML=html;
 soalArea.classList.remove('hidden');
}

function hitung(){
 let total=0,jumlah=0;
 document.querySelectorAll("input[type=radio]:checked").forEach(x=>{
   total+=parseInt(x.value); jumlah++;
 });
 let nilai=((total/(jumlah*4))*100).toFixed(2);
 let data={nama:nama.value,nisn:nisn.value,asal:asal.value,j1:jur1.value,j2:jur2.value,nilai:nilai};
 let arr=JSON.parse(localStorage.getItem("ppdb")||"[]");
 arr.push(data);
 localStorage.setItem("ppdb",JSON.stringify(arr));

 hasil.innerHTML=`<h3>Hasil Wawancara</h3>
 Nama: ${data.nama}<br>NISN: ${data.nisn}<br>
 Asal: ${data.asal}<br>
 Pilihan 1: ${data.j1}<br>
 Pilihan 2: ${data.j2}<br>
 <h2>Nilai Akhir ${nilai}</h2>
 <button onclick='window.print()'>Cetak PDF</button>`;
 hasil.classList.remove('hidden');
 load();
}

function load(){
 let arr=JSON.parse(localStorage.getItem("ppdb")||"[]");
 let h="<tr><th>Nama</th><th>NISN</th><th>Jurusan 1</th><th>Nilai</th></tr>";
 arr.forEach(x=>h+=`<tr><td>${x.nama}</td><td>${x.nisn}</td><td>${x.j1}</td><td>${x.nilai}</td></tr>`);
 hist.innerHTML=h;
}
function hapusHistori(){localStorage.removeItem("ppdb");load();}
function exportJSON(){
 let data=localStorage.getItem("ppdb")||"[]";
 let a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));
 a.download="histori_ppdb.json"; a.click();
}
load();
</script>
</body></html>
